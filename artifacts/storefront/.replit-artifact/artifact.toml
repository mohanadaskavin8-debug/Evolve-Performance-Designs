kind = "web"
previewPath = "/"
title = "Evolve Performance Storefront"
description = "Cinematic customer-facing e-commerce storefront for Evolve Performance — anime/movie-themed lifting straps, wristbands, belts, and fitness accessories. Features a skippable cinematic intro, scroll-driven animations, shop/collections/product pages, cart, checkout with Stripe, order tracking, and customer accounts via Clerk."
version = "1.0.0"
id = "artifacts/storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18539

[services.development]
run = "pnpm --filter @workspace/storefront run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18539"
BASE_PATH = "/"
