kind = "web"
previewPath = "/"
title = "Evolve Performance Storefront"
description = "Cinematic customer-facing e-commerce storefront for Evolve Performance — anime/movie-themed lifting straps and wrist wraps. Features a skippable cinematic intro, scroll-driven animations, a two-category home, category and product pages, cart, and Shopify hosted checkout; all product, cart and checkout data comes from the owner's Shopify store via the server-side API."
version = "1.0.0"
id = "artifacts/storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18539

[services.development]
run = "pnpm --filter @workspace/storefront run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18539"
BASE_PATH = "/"
