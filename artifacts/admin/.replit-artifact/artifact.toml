kind = "web"
previewPath = "/admin/"
title = "Evolve Performance Admin"
description = "Business operating system for Evolve Performance. Secure admin portal at /admin with Clerk RBAC (Owner/Manager/Staff roles). Modules: dashboard with real-time metrics and attention feed, orders lifecycle management with Stripe refund/cancel, returns review with inventory adjustments, products CRUD with wizard, design import, inventory management, customers, discounts, shipping rates, website content editor, admin user management, activity log, financial reporting, CSV exports, and system health status."
version = "1.0.0"
id = "artifacts/admin"
router = "path"

[[services]]
name = "web"
paths = [ "/admin/" ]
localPort = 23744

[services.development]
run = "pnpm --filter @workspace/admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/admin", "run", "build" ]
serve = "static"
publicDir = "artifacts/admin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23744"
BASE_PATH = "/admin/"
