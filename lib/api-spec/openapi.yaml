        totalOrders: { type: integer }
        avgOrderValueInCents: { type: integer }
        refundedInCents: { type: integer }
        topProducts:
          type: array
          items:
            type: object
            required: [productName, unitsSold, revenueInCents]
            properties:
              productName: { type: string }
              unitsSold: { type: integer }
              revenueInCents: { type: integer }
        salesByDay:
          type: array
          items:
