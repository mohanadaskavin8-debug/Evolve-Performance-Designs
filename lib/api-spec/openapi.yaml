            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignSendInput"
      responses:
        "200":
          description: Campaign transitioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "409":
          description: Campaign cannot be sent in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/marketing/campaigns/{id}/cancel:
    post:
      operationId: adminCancelCampaign
      tags: [admin]
      summary: Cancel a scheduled or sending campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /admin/marketing/campaigns/{id}/analytics:
    get:
      operationId: adminCampaignAnalytics
      tags: [admin]
      summary: Per-campaign delivery and engagement metrics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignAnalytics"

  /admin/marketing/templates:
    get:
      operationId: adminListEmailTemplates
      tags: [admin]
      summary: List owner-editable email templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailTemplate"

  /admin/marketing/templates/{key}:
    patch:
      operationId: adminUpdateEmailTemplate
      tags: [admin]
      summary: Update an email template's copy
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTemplateUpdate"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/marketing/automations:
    get:
      operationId: adminListAutomations
      tags: [admin]
      summary: List marketing automations with recent activity
      responses:
        "200":
          description: Automations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketingAutomationInfo"

  /admin/marketing/automations/{key}:
    patch:
      operationId: adminUpdateAutomation
      tags: [admin]
      summary: Enable/disable an automation or adjust its delay
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationUpdateInput"
      responses:
        "200":
          description: Updated automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingAutomationInfo"
        "404":
          description: Unknown automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Public: unsubscribe ────────────────────────────────────────────────────
  /marketing/unsubscribe/info:
    get:
      operationId: getUnsubscribeInfo
      tags: [marketing]
      summary: Resolve an unsubscribe token to its email address
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsubscribeInfo"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /marketing/unsubscribe:
    post:
      operationId: confirmUnsubscribe
      tags: [marketing]
      summary: Unsubscribe the address in the token (takes effect immediately)
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribeInput"
      responses:
        "200":
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsubscribeResult"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /marketing/resubscribe:
    post:
      operationId: confirmResubscribe
      tags: [marketing]
      summary: Confirm re-subscription via signed token (double opt-in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResubscribeInput"
      responses:
        "200":
          description: Re-subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResubscribeResult"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Address is hard-suppressed (bounce/complaint)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account/orders/{orderId}:
    get:
      operationId: getAccountOrderDetail
      tags: [account]
      summary: Get order detail for authenticated customer
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ── Schemas ────────────────────────────────────────────────────────────────────
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    WebhookAck:
      type: object
      required: [received]
      properties:
        received:
          type: boolean

    # ── Collection ───────────────────────────────────────────────────────────
    Collection:
      type: object
      required: [id, slug, name, description, imageUrl, productCount]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: ["string", "null"]
        productCount:
          type: integer

    CollectionDetail:
      type: object
      required: [id, slug, name, description, imageUrl, products]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: ["string", "null"]
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductCard"

    # ── Product ──────────────────────────────────────────────────────────────
    ProductCard:
      type: object
      required: [id, slug, name, priceMin, priceMax, primaryImageUrl, collectionName, status, stockStatus]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        theme:
          type: ["string", "null"]
        priceMin:
          type: integer
        priceMax:
          type: integer
        primaryImageUrl:
          type: ["string", "null"]
        collectionName:
          type: ["string", "null"]
        status:
          type: string
        stockStatus:
          type: string
        averageRating:
          type: ["number", "null"]
        reviewCount:
          type: integer

    ProductListResponse:
      type: object
      required: [products, total]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductCard"
        total:
          type: integer

    ProductDetail:
      type: object
      required: [id, slug, name, description, variants, images, collections]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        theme:
          type: ["string", "null"]
        description:
          type: string
        materials:
          type: ["string", "null"]
        benefits:
          type: ["string", "null"]
        shippingInfo:
          type: ["string", "null"]
        returnsInfo:
          type: ["string", "null"]
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        collections:
          type: array
          items:
            $ref: "#/components/schemas/Collection"
        averageRating:
          type: ["number", "null"]
        reviewCount:
          type: integer
        weightGrams:
          type: ["integer", "null"]
        dimensionsCm:
          type: ["string", "null"]
        hsCode:
          type: ["string", "null"]
        countryOfOrigin:
          type: ["string", "null"]

    ProductVariant:
      type: object
      required: [id, sku, priceInCents, stockQuantity, availableQuantity]
      properties:
        id:
          type: integer
        sku:
          type: string
        size:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        priceInCents:
          type: integer
        compareAtPriceInCents:
          type: ["integer", "null"]
        stockQuantity:
          type: integer
        availableQuantity:
          type: integer
        imageUrl:
          type: ["string", "null"]

    ProductImage:
      type: object
      required: [id, url, altText, position]
      properties:
        id:
          type: integer
        url:
          type: string
        altText:
          type: ["string", "null"]
        position:
          type: integer

    # ── Cart ─────────────────────────────────────────────────────────────────
    CartItemInput:
      type: object
      required: [sessionId, variantId, quantity]
      properties:
        sessionId:
          type: string
        variantId:
          type: integer
        quantity:
          type: integer
        clerkUserId:
          type: ["string", "null"]

    CartItemUpdate:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
        sessionId:
          type: string

    ClearCartInput:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string

    Cart:
      type: object
      required: [sessionId, items, subtotalInCents, itemCount]
      properties:
        sessionId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotalInCents:
          type: integer
        itemCount:
          type: integer

    CartItem:
      type: object
      required: [id, variantId, productId, productSlug, productName, variantSku, priceInCents, quantity]
      properties:
        id:
          type: string
        variantId:
          type: integer
        productId:
          type: integer
        productSlug:
          type: string
        productName:
          type: string
        variantSku:
          type: string
        size:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        priceInCents:
          type: integer
        quantity:
          type: integer
        imageUrl:
          type: ["string", "null"]

    # ── Checkout ─────────────────────────────────────────────────────────────
    CheckoutSessionInput:
      type: object
      required: [sessionId, successUrl, cancelUrl]
      properties:
        sessionId:
          type: string
        clerkUserId:
          type: ["string", "null"]
        customerEmail:
          type: ["string", "null"]
        discountCode:
          type: ["string", "null"]
        shippingZoneRateId:
          type: ["integer", "null"]
        countryCode:
          type: ["string", "null"]
          description: Destination country. Required to check out; the session pins Stripe address collection to it and validates the selected rate against its zone.
        postalCode:
          type: ["string", "null"]
          description: Destination postal/ZIP code, used to live-quote carrier-calculated rates with a real destination
        successUrl:
          type: string
        cancelUrl:
          type: string

    CheckoutVerifyResponse:
      type: object
      required: [orderNumber, status]
      properties:
        orderNumber:
          type: string
        status:
          type: string
        totalInCents:
          type: integer
        email:
          type: ["string", "null"]

    CheckoutSessionResponse:
      type: object
      required: [checkoutUrl, subtotalInCents, shippingInCents, taxInCents, totalInCents]
      properties:
        checkoutUrl:
          type: string
        subtotalInCents:
          type: integer
        shippingInCents:
          type: integer
        taxInCents:
          type: integer
        discountInCents:
          type: integer
        totalInCents:
          type: integer

    ShippingRateQuery:
      type: object
      required: [countryCode]
      properties:
        countryCode:
          type: string
        sessionId:
          type: string
        postalCode:
          type: ["string", "null"]
          description: Destination postal/ZIP code; enables live carrier quotes (otherwise stored fallback prices are shown)

    ShippingRateOption:
      type: object
      required: [id, name, description, priceInCents, estimatedDays]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        priceInCents:
          type: integer
        estimatedDays:
          type: string

    DiscountValidateInput:
      type: object
      required: [code, sessionId]
      properties:
        code:
          type: string
        sessionId:
          type: string

    DiscountValidateResponse:
      type: object
      required: [valid, code]
      properties:
        valid:
          type: boolean
        code:
          type: string
        discountType:
          type: ["string", "null"]
        value:
          type: ["integer", "null"]
        discountInCents:
          type: ["integer", "null"]
        error:
          type: ["string", "null"]

    # ── Orders ────────────────────────────────────────────────────────────────
    OrderSummary:
      type: object
      required: [id, orderNumber, status, totalInCents, currency, itemCount, createdAt]
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        status:
          type: string
        totalInCents:
          type: integer
        currency:
          type: string
        itemCount:
          type: integer
        trackingNumber:
          type: ["string", "null"]
        carrier:
          type: ["string", "null"]
        createdAt:
          type: string

    OrderDetail:
      type: object
      required: [id, orderNumber, status, items, subtotalInCents, shippingInCents, taxInCents, discountInCents, totalInCents, currency, shippingAddress, createdAt]
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        status:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotalInCents:
          type: integer
        shippingInCents:
          type: integer
        taxInCents:
          type: integer
        discountInCents:
          type: integer
        totalInCents:
          type: integer
        currency:
          type: string
        shippingAddress:
          $ref: "#/components/schemas/AddressSnapshot"
        trackingNumber:
          type: ["string", "null"]
        carrier:
          type: ["string", "null"]
        trackingUrl:
          type: ["string", "null"]
        estimatedDelivery:
          type: ["string", "null"]
        stripeRiskLevel:
          type: ["string", "null"]
        requiresManualReview:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    OrderItem:
      type: object
      required: [id, productName, variantSku, quantity, unitPriceInCents, totalPriceInCents]
      properties:
        id:
          type: integer
        productName:
          type: string
        productSlug:
          type: ["string", "null"]
        variantSku:
          type: string
        size:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        quantity:
          type: integer
        unitPriceInCents:
          type: integer
        totalPriceInCents:
          type: integer
        imageUrl:
          type: ["string", "null"]

    # ── Tracking ─────────────────────────────────────────────────────────────
    TrackingTimeline:
      type: object
      required: [orderNumber, status, events]
      properties:
        orderNumber:
          type: string
        status:
          type: string
        trackingNumber:
          type: ["string", "null"]
        carrier:
          type: ["string", "null"]
        trackingUrl:
          type: ["string", "null"]
        estimatedDelivery:
          type: ["string", "null"]
        events:
          type: array
          items:
            $ref: "#/components/schemas/TrackingEvent"

    TrackingEvent:
      type: object
      required: [status, label, description, isCompleted]
      properties:
        status:
          type: string
        label:
          type: string
        description:
          type: string
        location:
          type: ["string", "null"]
        timestamp:
          type: ["string", "null"]
        isCompleted:
          type: boolean
        isCurrent:
          type: boolean

    # ── Account ───────────────────────────────────────────────────────────────
    CustomerProfile:
      type: object
      required: [id, email, marketingConsent]
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        marketingConsent:
          type: boolean
        createdAt:
          type: string

    CustomerProfileUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        marketingConsent:
          type: boolean

    Address:
      type: object
      required: [id, name, line1, city, countryCode, isDefault]
      properties:
        id:
          type: integer
        name:
          type: string
        line1:
          type: string
        line2:
          type: ["string", "null"]
        city:
          type: string
        state:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]
        countryCode:
          type: string
        isDefault:
          type: boolean

    AddressInput:
      type: object
      required: [name, line1, city, countryCode]
      properties:
        name:
          type: string
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        countryCode:
          type: string
        isDefault:
          type: boolean

    AddressSnapshot:
      type: object
      required: [name, line1, city, countryCode]
      properties:
        name:
          type: string
        line1:
          type: string
        line2:
          type: ["string", "null"]
        city:
          type: string
        state:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]
        countryCode:
          type: string

    ReturnRequest:
      type: object
      required: [id, orderNumber, status, reason, createdAt]
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        status:
          type: string
        reason:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReturnLineItem"
        refundAmountInCents:
          type: ["integer", "null"]
        createdAt:
          type: string

    ReturnLineItem:
      type: object
      required: [orderItemId, quantity, reason]
      properties:
        orderItemId:
          type: integer
        quantity:
          type: integer
        reason:
          type: string
        notes:
          type: ["string", "null"]

    ReturnRequestInput:
      type: object
      required: [orderId, items, reason]
      properties:
        orderId:
          type: integer
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReturnLineItem"
        reason:
          type: string
        preferExchange:
          type: boolean

    # ── Reviews ───────────────────────────────────────────────────────────────
    Review:
      type: object
      required: [id, rating, title, body, reviewerName, isVerified, createdAt]
      properties:
        id:
          type: integer
        rating:
          type: integer
        title:
          type: string
        body:
          type: string
        reviewerName:
          type: string
        isVerified:
          type: boolean
        createdAt:
          type: string

    ReviewInput:
      type: object
      required: [rating, title, body, orderId]
      properties:
        rating:
          type: integer
        title:
          type: string
        body:
          type: string
        orderId:
          type: integer

    # ── Support ───────────────────────────────────────────────────────────────
    SupportRequestInput:
      type: object
      required: [email, subject, message]
      properties:
        email:
          type: string
        name:
          type: string
        subject:
          type: string
        message:
          type: string
        orderNumber:
          type: ["string", "null"]
        clerkUserId:
          type: ["string", "null"]

    SupportRequestResponse:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: integer
        status:
          type: string
        createdAt:
          type: string

    # ── Newsletter ────────────────────────────────────────────────────────────
    NewsletterSubscribeInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
        firstName:
          type: string
        source:
          type: string

    NewsletterSubscribeResponse:
      type: object
      required: [subscribed]
      properties:
        subscribed:
          type: boolean

    ResubscribeInput:
      type: object
      required: [token]
      properties:
        token:
          type: string

    ResubscribeResult:
      type: object
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
        email:
          type: string

    # ── Content ───────────────────────────────────────────────────────────────
    HomepageContent:
      type: object
      required: [sections, heroHeadline, heroSubtext]
      properties:
        heroHeadline:
          type: string
        heroSubtext:
          type: string
        heroCtaPrimary:
          type: string
        heroCtaSecondary:
          type: string
        announcementBanner:
          type: ["string", "null"]
        announcementActive:
          type: boolean
        sections:
          type: array
          items:
            $ref: "#/components/schemas/HomepageSection"

    HomepageSection:
      type: object
      required: [key, sectionType, position, active]
      properties:
        key:
          type: string
        sectionType:
          type: string
        position:
          type: integer
        active:
          type: boolean
        title:
          type: ["string", "null"]
        subtitle:
          type: ["string", "null"]

    PageContent:
      type: object
      required: [key, title, body, updatedAt]
      properties:
        key:
          type: string
        title:
          type: string
        body:
          type: string
        updatedAt:
          type: string

    SiteSettings:
      type: object
      required: [businessName, currency, supportEmail]
      properties:
        businessName:
          type: string
        logoUrl:
          type: ["string", "null"]
        faviconUrl:
          type: ["string", "null"]
        supportEmail:
          type: string
        currency:
          type: string
        defaultCountry:
          type: string
        socialInstagram:
          type: ["string", "null"]
        socialTiktok:
          type: ["string", "null"]
        socialYoutube:
          type: ["string", "null"]
        announcementBanner:
          type: ["string", "null"]

    # ── Shipping ──────────────────────────────────────────────────────────────
    ShippingZone:
      type: object
      required: [id, name, countries, rates]
      properties:
        id:
          type: integer
        name:
          type: string
        countries:
          type: array
          items:
            type: string
        rates:
          type: array
          items:
            $ref: "#/components/schemas/ShippingRate"

    ShippingRate:
      type: object
      required: [id, name, rateType, priceInCents, estimatedDays]
      properties:
        id:
          type: integer
        name:
          type: string
        rateType:
          type: string
        priceInCents:
          type: integer
        minimumOrderInCents:
          type: ["integer", "null"]
        estimatedDays:
          type: string

    # ── Discounts ─────────────────────────────────────────────────────────────
    Discount:
      type: object
      required: [code, discountType, value, active]
      properties:
        code:
          type: string
        discountType:
          type: string
        value:
          type: integer
        active:
          type: boolean
        minimumOrderInCents:
