        failed: { type: integer }
        skipped: { type: integer }
        delivered: { type: integer, description: "Where Resend reports it" }
        bounced: { type: integer }
        opened: { type: integer }
        clicked: { type: integer }
        unsubscribed: { type: integer, description: "Unsubscribes attributed to this campaign" }

    EmailTemplate:
      type: object
      required: [key, category, name, subject, headline, body, updatedAt]
      properties:
        key: { type: string }
