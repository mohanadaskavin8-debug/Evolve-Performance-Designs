openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: >-
    Evolve Performance API — storefront reads products, collections, cart and
    checkout from the owner's Shopify store (server-side Storefront API);
    newsletter, content pages and support remain first-party.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: shop
    description: Shopify-backed products, collections, cart and checkout
  - name: support
    description: Customer support
  - name: newsletter
    description: Newsletter subscriptions
  - name: content
    description: Website content management
  - name: marketing
    description: Public email marketing endpoints (unsubscribe)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Shop: products ───────────────────────────────────────────────────────────
  /shop/products:
    get:
      operationId: listShopProducts
      tags: [shop]
      summary: List products from the Shopify store
      parameters:
        - name: collection
          in: query
          schema:
            type: string
          description: Collection handle to filter by
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProductList"
        "502":
          description: Shopify upstream request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Shopify store not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shop/products/featured:
    get:
      operationId: listFeaturedShopProducts
      tags: [shop]
      summary: List featured products (tag "featured", falls back to newest)
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopProduct"
        "502":
          description: Shopify upstream request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Shopify store not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shop/products/{handle}:
    get:
      operationId: getShopProductByHandle
      tags: [shop]
      summary: Get a product by its Shopify handle
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Shopify upstream request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Shopify store not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Shop: collections ────────────────────────────────────────────────────────
  /shop/collections:
    get:
      operationId: listShopCollections
      tags: [shop]
      summary: List collections from the Shopify store
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopCollection"
        "502":
          description: Shopify upstream request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Shopify store not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shop/collections/{handle}:
    get:
      operationId: getShopCollectionByHandle
      tags: [shop]
      summary: Get a collection with its products by handle
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Collection with products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopCollectionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Shopify upstream request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Shopify store not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Shop: cart ───────────────────────────────────────────────────────────────
  # Shopify cart IDs are opaque GIDs (they contain "gid://" and "?key=") so they
  # travel as an encoded query parameter or in the request body — never in a path.
  /shop/cart:
    get:
      operationId: getShopCart
      tags: [shop]
      summary: Get a Shopify cart by ID (empty cart shape when absent or expired)
      parameters:
        - name: cartId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Cart contents (id is null when the cart is missing or expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopCart"
        "502":
          description: Shopify upstream request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Shopify store not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shop/cart/lines/add:
    post:
      operationId: addShopCartLines
      tags: [shop]
      summary: Add a variant to the cart (creates the cart when needed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopCartAddInput"
      responses:
        "200":
          description: Updated cart (store the returned id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopCart"
        "400":
          description: Invalid variant or quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Shopify upstream request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Shopify store not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shop/cart/lines/update:
    post:
      operationId: updateShopCartLine
      tags: [shop]
      summary: Update a cart line quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopCartUpdateInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopCart"
        "400":
          description: Invalid line or quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Shopify upstream request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Shopify store not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shop/cart/lines/remove:
    post:
      operationId: removeShopCartLine
      tags: [shop]
      summary: Remove a line from the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopCartRemoveInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopCart"
        "400":
          description: Invalid line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Shopify upstream request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Shopify store not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Support ───────────────────────────────────────────────────────────────────
  /support/requests:
    post:
      operationId: submitSupportRequest
      tags: [support]
      summary: Submit a customer support request (notifies the store owner by email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportRequestInput"
      responses:
        "201":
          description: Support request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestResponse"

  # ── Newsletter ────────────────────────────────────────────────────────────────
  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe to newsletter (records consent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscribeInput"
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscribeResponse"

  # ── Content ───────────────────────────────────────────────────────────────────
  /content/homepage:
    get:
      operationId: getHomepageContent
      tags: [content]
      summary: Get published homepage content and section order
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageContent"

  /content/page/{pageKey}:
    get:
      operationId: getPageContent
      tags: [content]
      summary: Get a content page by key (story, about, faq, privacy, terms, shipping-policy, return-policy, cookie-policy, accessibility)
      parameters:
        - name: pageKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageContent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /content/settings:
    get:
      operationId: getSiteSettings
      tags: [content]
      summary: Get public site settings (name, logo, social links, announcement)
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  # ── Public: unsubscribe ────────────────────────────────────────────────────
  /marketing/unsubscribe/info:
    get:
      operationId: getUnsubscribeInfo
      tags: [marketing]
      summary: Resolve an unsubscribe token to its email address
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsubscribeInfo"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /marketing/unsubscribe:
    post:
      operationId: confirmUnsubscribe
      tags: [marketing]
      summary: Unsubscribe the address in the token (takes effect immediately)
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribeInput"
      responses:
        "200":
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsubscribeResult"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /marketing/resubscribe:
    post:
      operationId: confirmResubscribe
      tags: [marketing]
      summary: Confirm re-subscription via signed token (double opt-in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResubscribeInput"
      responses:
        "200":
          description: Re-subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResubscribeResult"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Address is hard-suppressed (bounce/complaint)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ── Schemas ────────────────────────────────────────────────────────────────────
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Shop ──────────────────────────────────────────────────────────────────
    ShopProduct:
      type: object
      required: [id, handle, title, priceMinInCents, priceMaxInCents, availableForSale, tags]
      properties:
        id:
          type: string
          description: Shopify product GID
        handle:
          type: string
        title:
          type: string
        priceMinInCents:
          type: integer
        priceMaxInCents:
          type: integer
        compareAtPriceInCents:
          type: ["integer", "null"]
        imageUrl:
          type: ["string", "null"]
        theme:
          type: ["string", "null"]
          description: First non-"featured" product tag, used for theme filtering
        tags:
          type: array
          items:
            type: string
        availableForSale:
          type: boolean

    ShopProductList:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ShopProduct"

    ShopVariant:
      type: object
      required: [id, title, priceInCents, availableForSale]
      properties:
        id:
          type: string
          description: Shopify variant GID (used as merchandiseId when adding to cart)
        title:
          type: string
        sku:
          type: ["string", "null"]
        priceInCents:
          type: integer
        compareAtPriceInCents:
          type: ["integer", "null"]
        availableForSale:
          type: boolean
        quantityAvailable:
          type: ["integer", "null"]

    ShopProductDetail:
      type: object
      required: [id, handle, title, description, images, variants, tags, availableForSale]
      properties:
        id:
          type: string
        handle:
          type: string
        title:
          type: string
        description:
          type: string
        descriptionHtml:
          type: ["string", "null"]
        theme:
          type: ["string", "null"]
        compareAtPriceInCents:
          type: ["integer", "null"]
        imageUrl:
          type: ["string", "null"]
        images:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ShopVariant"
        tags:
          type: array
          items:
            type: string
        availableForSale:
          type: boolean

    ShopCollection:
      type: object
      required: [id, handle, title]
      properties:
        id:
          type: string
        handle:
          type: string
        title:
          type: string
        description:
          type: string

    ShopCollectionDetail:
      type: object
      required: [id, handle, title, products]
      properties:
        id:
          type: string
        handle:
          type: string
        title:
          type: string
        description:
          type: string
        products:
          type: array
          items:
            $ref: "#/components/schemas/ShopProduct"

    ShopCartLine:
      type: object
      required: [id, quantity, merchandiseId, productTitle, productHandle, variantTitle, priceInCents, lineTotalInCents]
      properties:
        id:
          type: string
          description: Cart line GID
        quantity:
          type: integer
        merchandiseId:
          type: string
          description: Variant GID
        productTitle:
          type: string
        productHandle:
          type: string
        variantTitle:
          type: string
        priceInCents:
          type: integer
        lineTotalInCents:
          type: integer
        imageUrl:
          type: ["string", "null"]

    ShopCart:
      type: object
      required: [id, checkoutUrl, totalQuantity, subtotalInCents, lines]
      properties:
        id:
          type: ["string", "null"]
          description: Cart GID — null when the cart does not exist or expired
        checkoutUrl:
          type: ["string", "null"]
          description: Shopify hosted checkout URL for this cart
        totalQuantity:
          type: integer
        subtotalInCents:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ShopCartLine"

    ShopCartAddInput:
      type: object
      required: [variantId, quantity]
      properties:
        cartId:
          type: ["string", "null"]
          description: Existing cart GID; omit or null to create a new cart
        variantId:
          type: string
          description: Variant GID to add
        quantity:
          type: integer

    ShopCartUpdateInput:
      type: object
      required: [cartId, lineId, quantity]
      properties:
        cartId:
          type: string
        lineId:
          type: string
        quantity:
          type: integer

    ShopCartRemoveInput:
      type: object
      required: [cartId, lineId]
      properties:
        cartId:
          type: string
        lineId:
          type: string

    # ── Support ───────────────────────────────────────────────────────────────
    SupportRequestInput:
      type: object
      required: [email, subject, message]
      properties:
        email:
          type: string
        name:
          type: string
        subject:
          type: string
        message:
          type: string
        orderNumber:
          type: ["string", "null"]

    SupportRequestResponse:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: integer
        status:
          type: string
        createdAt:
          type: string

    # ── Newsletter ────────────────────────────────────────────────────────────
    NewsletterSubscribeInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
        firstName:
          type: string
        source:
          type: string

    NewsletterSubscribeResponse:
      type: object
      required: [subscribed]
      properties:
        subscribed:
          type: boolean

    ResubscribeInput:
      type: object
      required: [token]
      properties:
        token:
          type: string

    ResubscribeResult:
      type: object
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
        email:
          type: string

    # ── Content ───────────────────────────────────────────────────────────────
    HomepageContent:
      type: object
      required: [sections, heroHeadline, heroSubtext]
      properties:
        heroHeadline:
          type: string
        heroSubtext:
          type: string
        heroCtaPrimary:
          type: string
        heroCtaSecondary:
          type: string
        announcementBanner:
          type: ["string", "null"]
        announcementActive:
          type: boolean
        sections:
          type: array
          items:
            $ref: "#/components/schemas/HomepageSection"

    HomepageSection:
      type: object
      required: [key, sectionType, position, active]
      properties:
        key:
          type: string
        sectionType:
          type: string
        position:
          type: integer
        active:
          type: boolean
        title:
          type: ["string", "null"]
        subtitle:
          type: ["string", "null"]

    PageContent:
      type: object
      required: [key, title, body, updatedAt]
      properties:
        key:
          type: string
        title:
          type: string
        body:
          type: string
        updatedAt:
          type: string

    SiteSettings:
      type: object
      required: [businessName, currency, supportEmail]
      properties:
        businessName:
          type: string
        logoUrl:
          type: ["string", "null"]
        faviconUrl:
          type: ["string", "null"]
        supportEmail:
          type: string
        currency:
          type: string
        defaultCountry:
          type: string
        socialInstagram:
          type: ["string", "null"]
        socialTiktok:
          type: ["string", "null"]
        socialYoutube:
          type: ["string", "null"]
        announcementBanner:
          type: ["string", "null"]

    # ── Marketing (public) ────────────────────────────────────────────────────
    UnsubscribeInfo:
      type: object
      required: [email, alreadyUnsubscribed]
      properties:
        email: { type: string }
        alreadyUnsubscribed: { type: boolean }

    UnsubscribeInput:
      type: object
      properties:
        token: { type: ["string", "null"] }

    UnsubscribeResult:
      type: object
      required: [unsubscribed, email]
      properties:
        unsubscribed: { type: boolean }
        email: { type: string }
