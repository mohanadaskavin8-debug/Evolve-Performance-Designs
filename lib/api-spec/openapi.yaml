            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string }
              latencyMs: { type: ["integer", "null"] }
              message: { type: ["string", "null"] }

    AdminMeResponse:
      type: object
      required: [clerkUserId, email, role]
      properties:
        clerkUserId: { type: string }
        email: { type: string }
        name: { type: ["string", "null"] }
        role: { type: string }
        isFirstSetup: { type: boolean }

    # ── Email marketing ────────────────────────────────────────────────────
    MarketingOverview:
      type: object
      required: [activeSubscribers, unsubscribedCount, suppressedCount, campaignsTotal, campaignsSent, testMode]
      properties:
        activeSubscribers: { type: integer }
        unsubscribedCount: { type: integer }
        suppressedCount: { type: integer }
        campaignsTotal: { type: integer }
        campaignsSent: { type: integer }
        openRate: { type: ["number", "null"], description: "Fraction 0-1 across sent campaigns, null when nothing measurable yet" }
        clickRate: { type: ["number", "null"] }
        testMode: { type: boolean, description: "True when marketing sends are redirected to the Resend test sink" }
        recentCampaigns:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"

    Subscriber:
      type: object
      required: [email, source, status, consentAt]
      properties:
        id: { type: ["integer", "null"] }
        email: { type: string }
        firstName: { type: ["string", "null"] }
        source: { type: string }
        status: { type: string, description: "active | unsubscribed | suppressed" }
        consentAt: { type: string }
        unsubscribedAt: { type: ["string", "null"] }

    SubscriberListResponse:
      type: object
      required: [subscribers, total]
      properties:
        subscribers:
          type: array
          items:
            $ref: "#/components/schemas/Subscriber"
        total: { type: integer }

    AudienceInfo:
      type: object
      required: [key, name, description, count]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        count: { type: integer, description: "Consented, non-suppressed recipients right now" }

    CampaignBlock:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type: { type: string, enum: [headline, text, image, product, discount, button] }
        text: { type: ["string", "null"] }
        url: { type: ["string", "null"] }
        alt: { type: ["string", "null"] }
        href: { type: ["string", "null"] }
        productId: { type: ["integer", "null"] }
        code: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        label: { type: ["string", "null"] }

    Campaign:
      type: object
      required: [id, name, subject, audienceKey, status, blocks, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        subject: { type: string }
        previewText: { type: ["string", "null"] }
        audienceKey: { type: string }
        status: { type: string, description: "draft | scheduled | sending | sent | canceled" }
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/CampaignBlock"
        scheduledAt: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        totalRecipients: { type: ["integer", "null"] }
        sentCount: { type: ["integer", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }

    CampaignInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        subject: { type: ["string", "null"] }
        previewText: { type: ["string", "null"] }
        audienceKey: { type: ["string", "null"] }
        blocks:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/CampaignBlock"

    CampaignSendInput:
      type: object
      properties:
        scheduledAt: { type: ["string", "null"], description: "ISO datetime; omit to send now" }

    TestSendInput:
      type: object
      required: [email]
      properties:
        email: { type: string }

    CampaignRenderInput:
      type: object
      required: [blocks]
      properties:
        subject: { type: ["string", "null"] }
        previewText: { type: ["string", "null"] }
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/CampaignBlock"

    CampaignRenderResponse:
